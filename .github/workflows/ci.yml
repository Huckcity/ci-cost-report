name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # Monday 06:17 UTC: weekly cost issue
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
  cost:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: CI cost report
        uses: ./
        with:
          days: 30
          issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
